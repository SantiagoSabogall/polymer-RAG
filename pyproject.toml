[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wvtr-extraction"
version = "1.3.0"
description = "Automated Water Vapor Transmission Rate Data Extraction from Polymer Science Literature"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Sebastian Sabogal", email = "ssabogal@institution.edu"}
]
keywords = ["polymer", "wvtr", "rag", "llm", "extraction", "packaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.3.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "opendataloader-pdf>=0.1.0",
    "boto3>=1.28.0",
    "nest-asyncio>=1.5.0",
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
benchmark = [
    "openpyxl>=3.1.0",
]
all = [
    "wvtr-extraction[dev,benchmark]",
]

[project.scripts]
pipeline = "main:main"
api-server = "api.server:main"
embeddings = "scripts.generate_embeddings:main"
benchmark-run = "benchmark.run_model:main"

[project.urls]
Homepage = "https://github.com/SantiagoSabogall/polymer-RAG"
Repository = "https://github.com/SantiagoSabogall/polymer-RAG"
Issues = "https://github.com/SantiagoSabogall/polymer-RAG/issues"

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "benchmark", "scripts", "app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
